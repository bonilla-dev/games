<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1a12; color: #e8ffe8; font: 16px system-ui, sans-serif; }
    body { display: grid; place-items: center; touch-action: none; }
    .wrap { display: grid; gap: 10px; justify-items: center; }
    .hud { display: flex; gap: 24px; font-weight: 600; }
    canvas { background: #10261a; border: 2px solid #1f8a5b; border-radius: 8px; width: min(90vmin, 520px); image-rendering: pixelated; }
    .msg { min-height: 1.5em; color: #9be15d; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud"><span>Puntos: <b id="score">0</b></span><span>Récord: <b id="best">0</b></span></div>
    <canvas id="c" width="400" height="400"></canvas>
    <div class="msg" id="msg">Pulsa una flecha para empezar</div>
  </div>
  <script>
    const N = 20, S = 20;
    const ctx = document.getElementById('c').getContext('2d');
    const $score = document.getElementById('score');
    const $best = document.getElementById('best');
    const $msg = document.getElementById('msg');
    let best = 0;
    try { best = +localStorage.getItem('snake-best') || 0; } catch {}
    $best.textContent = best;

    let snake, dir, next, food, score, running, paused, timer;

    function reset() {
      snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
      dir = next = { x: 1, y: 0 };
      score = 0; $score.textContent = 0;
      running = false; paused = false;
      placeFood(); draw();
    }

    function placeFood() {
      do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
      while (snake.some((s) => s.x === food.x && s.y === food.y));
    }

    function tick() {
      if (paused) return;
      dir = next;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some((s) => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++; $score.textContent = score; placeFood();
        clearInterval(timer); timer = setInterval(tick, Math.max(60, 130 - score * 3));
      } else {
        snake.pop();
      }
      draw();
    }

    function gameOver() {
      clearInterval(timer); running = false;
      if (score > best) { best = score; $best.textContent = best; try { localStorage.setItem('snake-best', best); } catch {} }
      $msg.textContent = `¡Fin! ${score} puntos · Pulsa una flecha para repetir`;
      snake = null;
    }

    function draw() {
      ctx.fillStyle = '#10261a'; ctx.fillRect(0, 0, 400, 400);
      ctx.fillStyle = '#ff4f5e'; ctx.beginPath();
      ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2 - 3, 0, Math.PI * 2); ctx.fill();
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#9be15d' : '#3cc47c';
        ctx.fillRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2);
      });
    }

    function turn(x, y) {
      if (!snake) reset();
      if (x === -dir.x && y === -dir.y) return;
      next = { x, y };
      if (!running) { running = true; $msg.textContent = ''; timer = setInterval(tick, 130); }
    }

    const KEYS = {
      ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1],
      ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0],
    };
    addEventListener('keydown', (e) => {
      if (KEYS[e.code]) { e.preventDefault(); turn(...KEYS[e.code]); }
      if (e.code === 'Space' && running) { e.preventDefault(); paused = !paused; $msg.textContent = paused ? 'Pausa' : ''; }
    });

    // Deslizar en móvil
    let t0;
    addEventListener('touchstart', (e) => { t0 = e.touches[0]; }, { passive: true });
    addEventListener('touchend', (e) => {
      if (!t0) return;
      const dx = e.changedTouches[0].clientX - t0.clientX, dy = e.changedTouches[0].clientY - t0.clientY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
    });

    reset();
  </script>
</body>
</html>
