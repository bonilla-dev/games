<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuestros Juegos</title>
  <meta name="description" content="Catálogo de todos los juegos que estamos creando.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="eyebrow">Arcade casero</p>
      <h1>Nuestros Juegos</h1>
      <p class="lead">Todo lo que estamos creando, en un solo sitio. Elige uno y dale a jugar.</p>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="toolbar" aria-label="Filtros">
      <input id="search" type="search" placeholder="Buscar por nombre, género o autor…" autocomplete="off">
      <div class="chips" id="status-filter" role="group" aria-label="Estado"></div>
      <select id="sort" aria-label="Ordenar">
        <option value="destacados">Destacados</option>
        <option value="az">A → Z</option>
      </select>
    </section>

    <div class="tags" id="tag-filter" role="group" aria-label="Géneros"></div>

    <section class="grid" id="grid" aria-live="polite"></section>
    <p class="empty" id="empty" hidden>No hay juegos que coincidan.</p>
  </main>

  <footer class="wrap foot">Hecho con cariño y muchas partidas de prueba.</footer>

  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
