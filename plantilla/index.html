<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITULO}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 16px system-ui, sans-serif; }
    body { display: grid; place-items: center; }
    canvas { background: #1b1b24; border-radius: 8px; max-width: 95vw; max-height: 85vh; }
  </style>
</head>
<body>
  <canvas id="c" width="640" height="400"></canvas>
  <script>
    // {{TITULO}} — empieza a programar aquí.
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const keys = new Set();
    addEventListener('keydown', (e) => keys.add(e.code));
    addEventListener('keyup', (e) => keys.delete(e.code));

    const player = { x: 320, y: 200, r: 16, speed: 240 };

    function update(dt) {
      if (keys.has('ArrowLeft') || keys.has('KeyA')) player.x -= player.speed * dt;
      if (keys.has('ArrowRight') || keys.has('KeyD')) player.x += player.speed * dt;
      if (keys.has('ArrowUp') || keys.has('KeyW')) player.y -= player.speed * dt;
      if (keys.has('ArrowDown') || keys.has('KeyS')) player.y += player.speed * dt;
      player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x));
      player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y));
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffcc33';
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#888';
      ctx.fillText('{{TITULO}} · muévete con flechas o WASD', 12, 20);
    }

    let last = performance.now();
    function loop(now) {
      update(Math.min((now - last) / 1000, 0.05));
      draw();
      last = now;
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
